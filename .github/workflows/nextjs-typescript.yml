name: Next.js + TypeScript

on:
  push:
    branches: [main]
    paths: &example-paths
      - 'apps/nextjs/**'
      - 'playwright/typescript/**'
      - 'setup/**'
      - 'CONTRACT.md'
      - '.env.example'
      - '.github/actions/prepare-framework-browser/**'
      - '.github/workflows/framework-browser.yml'
      - '.github/workflows/nextjs-typescript.yml'
  pull_request:
    paths: *example-paths
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  example:
    uses: ./.github/workflows/framework-browser.yml
    with:
      app: nextjs
